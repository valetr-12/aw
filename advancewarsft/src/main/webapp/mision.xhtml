<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title>Carrusel Diagonal Infinito</title>
    <style>
        body {
            margin: 0;
            background: #111;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .carousel-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-track {
            display: flex;
            gap: 50px;
            animation: scroll 20s linear infinite;
            transform: rotate(-10deg) skew(-10deg);
        }

        .carousel-item {
            min-width: 300px;
            height: 200px;
            background-color: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            transform: skew(10deg) rotate(10deg);
            transition: transform 0.3s;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-item:hover {
            transform: scale(1.05) skew(10deg) rotate(10deg);
        }

        @keyframes scroll {
            0% {
                transform: translate(0, 0) rotate(-10deg) skew(-10deg);
            }
            100% {
                transform: translate(-50%, 50%) rotate(-10deg) skew(-10deg);
            }
        }
    </style>
</h:head>
<h:body>
    <div class="carousel-container">
        <div class="carousel-track">
            <ui:repeat value="#{carouselBean.imageUrls}" var="img">
                <div class="carousel-item">
                    <img src="#{img}" alt="Imagen" />
                </div>
            </ui:repeat>
            <!-- Repetimos una vez más para efecto infinito visual -->
            <ui:repeat value="#{carouselBean.imageUrls}" var="img">
                <div class="carousel-item">
                    <img src="#{img}" alt="Imagen" />
                </div>
            </ui:repeat>
        </div>
    </div>
</h:body>
</html>
