<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
	<title>Advance Wars 1+2 Re-Boot</title>
	<style>
body {
	margin: 0;
	padding: 0;
	background-image: url("#{resource['images/fondo.png']}");
	background-size: cover;
	background-position: center;
	height: 100vh;
	font-family: Arial, sans-serif;
}

.menu-container {
	display: flex;
	flex-direction: column;
	align-items: flex-start;
	justify-content: flex-end;
	height: 100vh;
	padding-left: 40px;
	padding-bottom: 50px;
}

.title {
	position: absolute;
	top: 50px;
	left: 50%;
	transform: translateX(-50%);
	z-index: 1;
}

.btn-orange {
	background-color: #f97316;
	border: none;
	color: white;
	padding: 10px 30px;
	font-size: 18px;
	margin-bottom: 20px;
	border-radius: 10px;
	cursor: pointer;
}

.btn-blue {
	background-color: #2563eb;
	border: none;
	color: white;
	padding: 10px 30px;
	font-size: 18px;
	border-radius: 10px;
	cursor: pointer;
}

.btn-orange:hover, .btn-blue:hover {
	opacity: 0.9;
}
</style>
</h:head>
<h:body>
	<div class="title">
		<h:graphicImage name="images/logo_advancewars.png" width="500px" />
	</div>

	<div class="menu-container">
		<h:form>
			<p:commandButton value="1 Player" styleClass="btn-orange"
				action="#{menuView.onePlayer}" />
			<p:commandButton value="Multiplayer" styleClass="btn-blue"
				action="#{menuView.multiplayer}" />
		</h:form>
	</div>
</h:body>
</html>
